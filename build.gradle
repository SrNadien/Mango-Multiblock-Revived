plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}



group = mod_group_id
version = "${mcversion}-${mod_version}"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}





sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()

    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

neoForge {
    // This is what actually pulls in Minecraft + NeoForge 26.1.2.78 onto the classpath.
    // A plain `implementation "net.neoforged:neoforge:${neoversion}"` dependency does NOT work
    // on its own -- that artifact is an empty "userdev" stub that only ModDevGradle knows how
    // to expand into the real, patched Minecraft classes (hence the "package ... does not exist"
    // errors for even Guava/Apache Commons, which never got a classpath at all).
    version = neoversion

    // Uncomment if/when you want Mojang javadocs via Parchment (no longer required for names,
    // since Mojang ships official parameter names as of 26.1):
    // parchment {
    //     minecraftVersion = minecraft_version
    //     mappingsVersion = "<parchment version>"
    // }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
}


tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mcversion              : mcversion,
            minecraft_version      : minecraft_version,
            mod_version            : mod_version,
            mod_id                 : mod_id,
            modid                  : mod_id,
            mod_name               : mod_name,
            mod_named              : mod_named,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            author                 : mod_authors,
            description            : mod_description,
            tag_lanzador           : tag_lanzador,
            issue_tracker          : issue_tracker ?: '',
            neo_version            : neo_version,
            neoversion             : neoversion,
            neoforge_version       : neoforge_version,
            loader_version         : loader_version,
            loader_version_range   : loader_version_range,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "2", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.getRelease().set(25)
}


jar {
    from sourceSets.main.output
    from sourceSets.main.allJava
    from sourceSets.main.allSource

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}